<div class="min-h-screen bg-gray-100 flex items-center justify-center">

  <div class="w-full max-w-md space-y-6">

    <!-- TÍTULO -->
    <h1 class="text-4xl font-bold text-center text-gray-800">

      Panel de Control

    </h1>

    <!-- MENU -->
    <button
      [routerLink]="['/menu']"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white py-5 rounded-2xl shadow-lg text-xl font-semibold transition duration-300">

      📋 Menú

    </button>


    <!-- CREAR PEDIDO -->
    <button
    *ngIf="usuario?.tipo_usuario === 'camarero'"
      [routerLink]="['/crear-pedido']"
      class="w-full bg-green-600 hover:bg-green-700 text-white py-5 rounded-2xl shadow-lg text-xl font-semibold transition duration-300">

      ➕ Crear Pedido

    </button>

    <!-- DETALLE PEDIDOS -->
    <button
    *ngIf="usuario?.tipo_usuario === 'camarero'"
      [routerLink]="['/detalle-pedidos']"
      class="w-full bg-orange-500 hover:bg-orange-600 text-white py-5 rounded-2xl shadow-lg text-xl font-semibold transition duration-300">

      🧾 Detalle Pedidos

    </button>

    <!-- DETALLE PEDIDOS -->
    <button
    *ngIf="usuario?.tipo_usuario === 'cocina'"
      [routerLink]="['/preparacion-platos']"
      class="w-full bg-red-500 hover:bg-red-600 text-white py-5 rounded-2xl shadow-lg text-xl font-semibold transition duration-300">

      🔥 Preparación de platos

    </button>

  </div>

</div>

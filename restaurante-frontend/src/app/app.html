<div class="min-h-screen bg-gray-100">

  <!-- NAVBAR -->
<!-- NAVBAR -->
<nav class="bg-gray-900 text-white px-6 py-4">

  <div class="flex justify-between items-center">

    <!-- LOGO -->
    <div class="text-2xl font-bold">
      🍽️ Restaurante App
    </div>

    <!-- MENU DESKTOP -->
    <div *ngIf="usuario" class="hidden md:flex items-center gap-6">

      <!-- LINKS -->
      <div class="space-x-4 text-sm">
       <a
          routerLink="/dashboard"
          class="hover:text-yellow-400 transition">

          Dashboard

        </a>

        <a
          routerLink="/menu"
          class="hover:text-yellow-400 transition">

          Menu

        </a>

        <a
        *ngIf="usuario?.tipo_usuario === 'camarero'"
          routerLink="/crear-pedido"
          class="hover:text-yellow-400 transition">

          Crear pedido

        </a>

        <a
        *ngIf="usuario?.tipo_usuario === 'camarero'"
          routerLink="/detalle-pedidos"
          class="hover:text-yellow-400 transition">

          Detalle pedidos

        </a>
        <a
          *ngIf="usuario?.tipo_usuario === 'cocina'"
          routerLink="/preparacion-platos">

          Preparación de platos

        </a>
      

      </div>

      <!-- USUARIO -->
      <div class="relative">

        <button
          (click)="toggleMenu()"
          class="bg-gray-800 px-4 py-2 rounded-lg hover:bg-gray-700 transition">

          {{ usuario?.nombre }}

        </button>

        <!-- DROPDOWN -->
        <div
          *ngIf="menuOpen"
          class="absolute right-0 mt-2 w-40 bg-white text-black rounded-lg shadow-lg overflow-hidden z-50">

          <button
            (click)="logout()"
            class="w-full text-left px-4 py-3 hover:bg-gray-100">

            Logout

          </button>

        </div>

      </div>

    </div>

    <!-- BOTON MOBILE -->
    <button
    *ngIf="usuario"
      (click)="mobileMenuOpen = !mobileMenuOpen"
      class="md:hidden bg-gray-800 px-3 py-2 rounded-lg">

      ☰

    </button>

  </div>

  <!-- MENU MOBILE -->
  <div
    *ngIf="usuario && mobileMenuOpen"
    class="md:hidden mt-6 space-y-4 border-t border-gray-700 pt-4">

    <!-- LINKS -->
    <div class="flex flex-col gap-4 text-sm">
      <a
        routerLink="/dashboard"
        class="hover:text-yellow-400 transition">

        Dashboard

      </a>

      <a
        routerLink="/menu"
        class="hover:text-yellow-400 transition">

        Menu

      </a>

      <a
      *ngIf="usuario?.tipo_usuario === 'camarero'"
        routerLink="/crear-pedido"
        class="hover:text-yellow-400 transition">

        Crear pedido

      </a>

      <a
      *ngIf="usuario?.tipo_usuario === 'camarero'"
        routerLink="/detalle-pedidos"
        class="hover:text-yellow-400 transition">

        Detalle pedidos

      </a>

    </div>

    <!-- USUARIO MOBILE -->
    <div class="relative pt-4">

      <button
        (click)="toggleMenu()"
        class="bg-gray-800 px-4 py-2 rounded-lg hover:bg-gray-700 transition w-full text-left">

        {{ usuario?.nombre }}

      </button>

      <!-- DROPDOWN -->
      <div
        *ngIf="menuOpen"
        class="mt-2 bg-white text-black rounded-lg shadow-lg overflow-hidden">

        <button
          (click)="logout()"
          class="w-full text-left px-4 py-3 hover:bg-gray-100">

          Logout

        </button>

      </div>

    </div>

  </div>

</nav>

  <!-- CONTENIDO -->
  <main class="p-6">

    <router-outlet></router-outlet>
    <app-loading></app-loading>
  </main>

</div>
